services:
  magicmirror:
    build:
      context: .
      dockerfile: display/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EINK_SERVICE_URL: "http://eink-service:3001/trigger"
    restart: unless-stopped

  eink-service:
    build:
      context: ./eink-service
    ports:
      - "3001:3001"
    depends_on:
      - magicmirror
    environment:
      MAGICMIRROR_URL: "http://magicmirror:8080"
      CHROMIUM_PATH: "/usr/bin/chromium"
      CHROMEDRIVER_PATH: "/usr/bin/chromedriver"
      MM_STARTUP_DELAY: "1"
      GPIOZERO_PIN_FACTORY: rpigpio
    devices:
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/gpiomem:/dev/gpiomem"
    volumes:
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /sys/firmware/devicetree/base:/proc/device-tree:ro
    privileged: true
    restart: unless-stopped

  comms-service:
    build:
      context: ./comms-service
    ports:
      - "3002:3002"
    environment:
      ROCKBLOCK_PORT: "/dev/ttyUSB0"
      GPS_PORT: "/dev/ttyAMA0"
      GPS_BAUD: "9600"
      WEATHER_INTERVAL_MS: "21600000"    # 6 hours
      TIME_SYNC_INTERVAL_MS: "43200000"  # 12 hours
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    restart: unless-stopped
